# The key combination used to send commands to tmux.
# Default: C-b
set -g prefix C-space

# Enable mouse support: click to select panes/windows, scroll, resize panes.
# Default: off
set -g mouse on

# Starting index for window numbers. 1 is more ergonomic for keyboard switching.
# Default: 0
set -g base-index 1

# Starting index for pane numbers within windows.
# Default: 0
setw -g pane-base-index 1

# Number of lines to keep in scrollback buffer per pane.
# Default: 2000
set -g history-limit 50000

# Show or hide the status bar.
# Default: on
set -g status on

# Position of the status bar (top or bottom).
# Default: bottom
set -g status-position bottom

# How often (seconds) to refresh the status bar.
# Default: 15
set -g status-interval 15
