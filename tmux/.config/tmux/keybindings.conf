# Set the default prefix key to C-Space.
set-option -g prefix C-Space
unbind-key C-b
bind-key C-Space send-prefix

# Use vi key bindings in copy mode
set-option -wg mode-keys vi

# Use vi key bindings to navigate between the panes
unbind-key -T prefix Up
bind-key -r -T prefix k select-pane -U

unbind-key -T prefix Down
bind-key -r -T prefix j select-pane -D

unbind-key -T prefix Left
bind-key -r -T prefix h select-pane -L

unbind-key -T prefix Right
bind-key -r -T prefix l select-pane -R

# Copy to clipboard using 'y' in copy mode
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Configure selection using 'v' in copy mode
unbind-key -T copy-mode-vi v
bind-key -T copy-mode-vi v send-keys -X begin-selection

unbind-key -T copy-mode-vi Space
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle 

# Switch windows using Alt + Number (without prefix)
bind-key -n M-1 select-window -t 1
bind-key -n M-2 select-window -t 2
bind-key -n M-3 select-window -t 3
bind-key -n M-4 select-window -t 4
bind-key -n M-5 select-window -t 5
bind-key -n M-6 select-window -t 6
bind-key -n M-7 select-window -t 7
bind-key -n M-8 select-window -t 8
bind-key -n M-9 select-window -t 9

# Remap 'prefix r' (refresh-client) to 'prefix R'
unbind-key -T prefix r
bind-key -T prefix R refresh-client

# Source tmux config with 'prefix r'
bind-key r source-file ~/.config/tmux/tmux.conf \; display-message "source-file done"

# Remap 'prefix f' (find-window) to 'prefix F'
unbind-key -T prefix f
bind-key -T prefix F command-prompt "find-window '%%'"

# Open fzf with preview in popup window and become nvim on select (use pane's current path)
bind-key -T prefix f display-popup -w 90% -h 90% -k -E -d '#{pane_current_path}' -T 'fzf from #{pane_current_path}' "fzf --style full --preview 'bat {}' --bind 'enter:become(nvim {})'"

# Open lazygit in popup window (use pane's current path)
bind-key -T prefix g display-popup -w 90% -h 90% -k -E -d '#{pane_current_path}' -T 'lazygit from #{pane_current_path}' lazygit
